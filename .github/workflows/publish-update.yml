name: Publish DriveCanvas signed update

on:
  push:
    branches: [main]
    paths:
      - 'stable.json'
      - 'DriveCanvas-*.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the exact signed candidate selected by the feed
        id: verify
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          data=json.loads(pathlib.Path('stable.json').read_text())
          version=data['versionName']
          assert re.fullmatch(r'[0-9A-Za-z._-]+',version), 'Invalid version'
          assert isinstance(data['versionCode'],int) and data['versionCode']>=250
          assert data['required'] is True, 'The selected rollout is required'
          apk=pathlib.Path('DriveCanvas-'+version+'.apk')
          assert apk.is_file(), 'Release APK missing'
          assert apk.stat().st_size==data['apkSizeBytes'], 'APK size mismatch'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==data['sha256'], 'APK hash mismatch'
          expected='https://github.com/mdqr69/DriveCanvas-Releases/releases/download/v'+version+'/'+apk.name
          assert data['apkUrl']==expected, 'APK URL does not match this release'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('tag=v'+version+'\n')
              out.write('apk='+apk.name+'\n')
          PY
      - name: Publish latest update to the public feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
          RELEASE_APK: ${{ steps.verify.outputs.apk }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RELEASE_APK" stable.json --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --latest --notes-file RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$RELEASE_APK" stable.json --latest --title "DriveCanvas ${RELEASE_TAG#v}" --notes-file RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          fi
